services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: servcall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: servcall
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servcall"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    # רק על הלולאה המקומית. פורטים 80 ו-443 כבר תפוסים על השרת הזה,
    # אז reverse proxy קיים מפנה לכאן. ראה README, "חיבור לדומיין".
    ports: ["127.0.0.1:${APP_PORT:-3001}:3000"]
    environment:
      DATABASE_URL: postgres://servcall:${POSTGRES_PASSWORD}@db:5432/servcall
      PORT: 3000
      MEDIA_DIR: /data/files
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WA_TEAM_URL: ${WA_TEAM_URL:-}
      WA_TEAM_TOKEN: ${WA_TEAM_TOKEN:-}
    volumes: [files:/data/files]

  # Caddy משלנו רץ רק כשאין reverse proxy אחר על המכונה. הוא אינו עולה
  # כברירת מחדל: --profile edge מפעיל אותו.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  files:
  caddy_data:
  caddy_config:
